name: Windows CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WallpaperScheduler.sln

      - name: Build
        run: dotnet build WallpaperScheduler.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/WallpaperScheduler.Domain.Tests/WallpaperScheduler.Domain.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publish Windows x64
        run: dotnet publish src/WallpaperScheduler.App/WallpaperScheduler.App.csproj -c Release -r win-x64 -o artifacts/WallpaperScheduler

      - name: Verify package
        shell: pwsh
        run: |
          $exe = "artifacts/WallpaperScheduler/WallpaperScheduler.exe"
          if (!(Test-Path $exe)) { throw "WallpaperScheduler.exe não foi publicado." }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "WallpaperScheduler.exe SHA256 $hash" | Set-Content "artifacts/WallpaperScheduler/SHA256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperScheduler-win-x64
          path: artifacts/WallpaperScheduler
